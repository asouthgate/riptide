name: Rust CI

on:
  push:
    branches:
      - dev*
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: rust:latest

    steps:
    - uses: actions/checkout@v2

    - name: Install Clippy
      run: rustup component add clippy

    - name: Lint
      run: cargo clippy

    - name: Build
      run: cargo build --verbose

    - name: Run unit tests
      run: cargo test --verbose
